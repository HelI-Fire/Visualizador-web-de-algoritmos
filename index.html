<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de 8 Algoritmos de Ordenamiento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Visualizador de Algoritmos de Ordenamiento</h1>
        <p>Selecciona cualquiera de los 8 algoritmos, ajusta los parámetros y observa su funcionamiento.</p>
    </header>

    <!-- Tablero / Panel de Control Superior -->
    <div class="control-panel">
        <div class="control-group">
            <label for="algorithm">Algoritmo</label>
            <select id="algorithm">
                <option value="bubble">Bubble Sort</option>
                <option value="insertion">Insertion Sort</option>
                <option value="selection">Selection Sort</option>
                <option value="merge">Merge Sort</option>
                <option value="quick">Quick Sort</option>
                <option value="heap">Heap Sort</option>
                <option value="shell">Shell Sort</option>
                <option value="stooge">Stooge Sort</option>
            </select>
        </div>

        <div class="control-group">
            <label for="elements-slider" id="label-elements">Elementos: 15</label>
            <input type="range" id="elements-slider" min="5" max="40" value="15">
        </div>

        <div class="control-group">
            <label for="speed-slider" id="label-speed">Velocidad: 100 ms</label>
            <input type="range" id="speed-slider" min="10" max="500" value="100">
        </div>

        <div class="btn-container">
            <button class="btn-generate" id="btn-generate">Generar arreglo</button>
            <button class="btn-start" id="btn-start">▶ Iniciar</button>
            <button class="btn-pause" id="btn-pause">❚❚ Pausar</button>
            <button class="btn-reset" id="btn-reset">↺ Reiniciar</button>
            <button class="btn-compare" id="btn-compare">⚖️ Comparar Dos</button>
        </div>
    </div>

    <!-- Barras gráficas (izquierda) y código del algoritmo (derecha) -->
    <div class="main-area">
        <div id="array-container"></div>
        <aside id="code-panel">
            <div id="code-title">Código</div>
            <div id="code-body"></div>
        </aside>
    </div>

    <!-- Panel de comparación con selectores, selector de tamaño y animación simultánea -->
    <div id="comparison-container" style="display: none; margin-top: 20px; flex-direction: column; gap: 15px; background: #181818; padding: 20px; border-radius: 8px;">
        <div style="display: flex; justify-content: center; align-items: flex-end; gap: 20px; flex-wrap: wrap;">
            <div class="control-group">
                <label for="algo1-select">Método 1:</label>
                <select id="algo1-select">
                    <option value="bubble">Bubble Sort</option>
                    <option value="insertion">Insertion Sort</option>
                    <option value="selection">Selection Sort</option>
                    <option value="merge">Merge Sort</option>
                    <option value="quick">Quick Sort</option>
                    <option value="heap">Heap Sort</option>
                    <option value="shell">Shell Sort</option>
                    <option value="stooge">Stooge Sort</option>
                </select>
            </div>
            <div class="control-group">
                <label for="algo2-select">Método 2:</label>
                <select id="algo2-select">
                    <option value="quick">Quick Sort</option>
                    <option value="bubble">Bubble Sort</option>
                    <option value="insertion">Insertion Sort</option>
                    <option value="selection">Selection Sort</option>
                    <option value="merge">Merge Sort</option>
                    <option value="heap">Heap Sort</option>
                    <option value="shell">Shell Sort</option>
                    <option value="stooge">Stooge Sort</option>
                </select>
            </div>
            <div class="control-group">
                <label for="elements-slider-comp" id="label-elements-comp">Elementos: 15</label>
                <input type="range" id="elements-slider-comp" min="5" max="40" value="15">
            </div>
            <button class="btn-compare-start" id="btn-compare-start">▶ Iniciar Comparación</button>
            <button class="btn-pause" id="btn-comp-pause">❚❚ Pausar</button>
            <button class="btn-reset" id="btn-comp-reset">↺ Reiniciar</button>
        </div>

        <div style="display: flex; gap: 20px; justify-content: space-around; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 250px; background: #121212; padding: 15px; border-radius: 8px; text-align: center;">
                <h3 id="title-algo1">Método 1</h3>
                <p id="time-algo1">Tiempo: 0 ms</p>
                <div id="container-algo1" style="display: flex; align-items: flex-end; justify-content: center; height: 250px; gap: 2px;"></div>
            </div>
            <div style="flex: 1; min-width: 250px; background: #121212; padding: 15px; border-radius: 8px; text-align: center;">
                <h3 id="title-algo2">Método 2</h3>
                <p id="time-algo2">Tiempo: 0 ms</p>
                <div id="container-algo2" style="display: flex; align-items: flex-end; justify-content: center; height: 250px; gap: 2px;"></div>
            </div>
        </div>
        <div id="comparison-result" style="text-align: center; font-size: 18px; font-weight: bold; color: #38a169;"></div>
    </div>

    <script>
        const container = document.getElementById('array-container');
        const elementsSlider = document.getElementById('elements-slider');
        const speedSlider = document.getElementById('speed-slider');
        const labelElements = document.getElementById('label-elements');
        const labelSpeed = document.getElementById('label-speed');
        
        const btnGenerate = document.getElementById('btn-generate');
        const btnStart = document.getElementById('btn-start');
        const btnPause = document.getElementById('btn-pause');
        const btnReset = document.getElementById('btn-reset');
        const btnCompare = document.getElementById('btn-compare');
        const btnCompareStart = document.getElementById('btn-compare-start');
        const algorithmSelect = document.getElementById('algorithm');

        const elementsSliderComp = document.getElementById('elements-slider-comp');
        const labelElementsComp = document.getElementById('label-elements-comp');

        let array = [];
        let originalArray = [];
        let isSorting = false;
        let isPaused = false;
        let stopRequested = false;

        // --- NÚMEROS ENCIMA DE LAS BARRAS ---
        // Muestra el valor numérico de cada barra a partir de su altura
        function etiquetar(bar) {
            const v = Math.round(parseFloat(bar.style.height) / 3);
            let s = bar.querySelector('.valor');
            if (!s) {
                s = document.createElement('span');
                s.className = 'valor';
                bar.appendChild(s);
            }
            s.textContent = v;
        }

        // Cada vez que una barra cambie de altura, actualiza su número
        new MutationObserver(muts => {
            muts.forEach(m => {
                if (m.target.classList.contains('bar')) etiquetar(m.target);
            });
        }).observe(container, { attributes: true, attributeFilter: ['style'], subtree: true });

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function checkControlState() {
            if (stopRequested) throw new Error("Stopped");
            while (isPaused) {
                await sleep(100);
                if (stopRequested) throw new Error("Stopped");
            }
        }

        function generateArray() {
            if (isSorting) return;
            container.innerHTML = '';
            detenerComparacion();
            document.getElementById('comparison-container').style.display = 'none';
            document.getElementById('comparison-result').innerText = '';
            array = [];
            const numElements = elementsSlider.value;
            
            for (let i = 0; i < numElements; i++) {
                const value = Math.floor(Math.random() * 100) + 15;
                array.push(value);
                
                const bar = document.createElement('div');
                bar.classList.add('bar');
                bar.style.height = `${value * 3}px`;
                container.appendChild(bar);
                etiquetar(bar);
            }
            originalArray = [...array];
        }

        function updateBars() {
            const bars = document.getElementsByClassName('bar');
            for (let i = 0; i < array.length; i++) {
                bars[i].style.height = `${array[i] * 3}px`;
                bars[i].style.backgroundColor = '#4a5568';
            }
        }

        // --- PANEL DE CÓDIGO ---
        // Cada algoritmo guarda las líneas que se muestran. El número entre /* */ es el índice
        // de línea que usan las llamadas a resaltar([...]) dentro de cada algoritmo.
        const CODIGOS = {
            bubble: {
                titulo: 'Bubble Sort',
                lineas: [
                    /*0*/ 'for (let i = 0; i < n; i++) {',
                    /*1*/ '  for (let j = 0; j < n - i - 1; j++) {',
                    /*2*/ '    if (array[j] > array[j + 1]) {',
                    /*3*/ '      let temp = array[j];',
                    /*4*/ '      array[j] = array[j + 1];',
                    /*5*/ '      array[j + 1] = temp;',
                    /*6*/ '    }',
                    /*7*/ '  }',
                    /*8*/ '  // array[n - i - 1] ya quedó en su lugar',
                    /*9*/ '}'
                ]
            },
            insertion: {
                titulo: 'Insertion Sort',
                lineas: [
                    /*0*/ 'for (let i = 1; i < n; i++) {',
                    /*1*/ '  let key = array[i];',
                    /*2*/ '  let j = i - 1;',
                    /*3*/ '  while (j >= 0 && array[j] > key) {',
                    /*4*/ '    array[j + 1] = array[j];',
                    /*5*/ '    j = j - 1;',
                    /*6*/ '  }',
                    /*7*/ '  array[j + 1] = key;',
                    /*8*/ '}'
                ]
            },
            selection: {
                titulo: 'Selection Sort',
                lineas: [
                    /*0*/ 'for (let i = 0; i < n; i++) {',
                    /*1*/ '  let minIdx = i;',
                    /*2*/ '  for (let j = i + 1; j < n; j++) {',
                    /*3*/ '    if (array[j] < array[minIdx]) {',
                    /*4*/ '      minIdx = j;',
                    /*5*/ '    }',
                    /*6*/ '  }',
                    /*7*/ '  if (minIdx !== i) {',
                    /*8*/ '    let temp = array[i];',
                    /*9*/ '    array[i] = array[minIdx];',
                    /*10*/ '    array[minIdx] = temp;',
                    /*11*/ '  }',
                    /*12*/ '}'
                ]
            },
            merge: {
                titulo: 'Merge Sort',
                lineas: [
                    /*0*/ 'function mergeSort(start, end) {',
                    /*1*/ '  if (start >= end) return;',
                    /*2*/ '  let mid = Math.floor((start + end) / 2);',
                    /*3*/ '  mergeSort(start, mid);',
                    /*4*/ '  mergeSort(mid + 1, end);',
                    /*5*/ '  merge(start, mid, end);',
                    /*6*/ '}',
                    /*7*/ 'function merge(start, mid, end) {',
                    /*8*/ '  // comparar las dos mitades ya ordenadas',
                    /*9*/ '  while (i <= mid && j <= end) {',
                    /*10*/ '    if (array[i] <= array[j]) temp.push(array[i++]);',
                    /*11*/ '    else temp.push(array[j++]);',
                    /*12*/ '  }',
                    /*13*/ '  // pasar lo que sobre de cada mitad',
                    /*14*/ '  while (i <= mid) temp.push(array[i++]);',
                    /*15*/ '  while (j <= end) temp.push(array[j++]);',
                    /*16*/ '  // escribir temp en el arreglo',
                    /*17*/ '  for (let k = 0; k < temp.length; k++) {',
                    /*18*/ '    array[start + k] = temp[k];',
                    /*19*/ '  }',
                    /*20*/ '}'
                ]
            },
            quick: {
                titulo: 'Quick Sort',
                lineas: [
                    /*0*/ 'function quickSort(low, high) {',
                    /*1*/ '  if (low < high) {',
                    /*2*/ '    let pi = partition(low, high);',
                    /*3*/ '    quickSort(low, pi - 1);',
                    /*4*/ '    quickSort(pi + 1, high);',
                    /*5*/ '  }',
                    /*6*/ '}',
                    /*7*/ 'function partition(low, high) {',
                    /*8*/ '  let pivot = array[high];',
                    /*9*/ '  let i = low - 1;',
                    /*10*/ '  for (let j = low; j < high; j++) {',
                    /*11*/ '    if (array[j] < pivot) {',
                    /*12*/ '      i++;',
                    /*13*/ '      [array[i], array[j]] = [array[j], array[i]];',
                    /*14*/ '    }',
                    /*15*/ '  }',
                    /*16*/ '  // el pivote va a su posición final',
                    /*17*/ '  [array[i + 1], array[high]] = [array[high], array[i + 1]];',
                    /*18*/ '  return i + 1;',
                    /*19*/ '}'
                ]
            },
            heap: {
                titulo: 'Heap Sort',
                lineas: [
                    /*0*/ 'function heapSort() {',
                    /*1*/ '  // 1) construir el heap máximo',
                    /*2*/ '  for (let i = Math.floor(n / 2) - 1; i >= 0; i--)',
                    /*3*/ '    heapify(n, i);',
                    /*4*/ '  // 2) mover el máximo al final y reacomodar',
                    /*5*/ '  for (let i = n - 1; i > 0; i--) {',
                    /*6*/ '    [array[0], array[i]] = [array[i], array[0]];',
                    /*7*/ '    heapify(i, 0);',
                    /*8*/ '  }',
                    /*9*/ '}',
                    /*10*/ 'function heapify(n, i) {',
                    /*11*/ '  let largest = i;',
                    /*12*/ '  let l = 2 * i + 1, r = 2 * i + 2;',
                    /*13*/ '  if (l < n && array[l] > array[largest]) largest = l;',
                    /*14*/ '  if (r < n && array[r] > array[largest]) largest = r;',
                    /*15*/ '  if (largest !== i) {',
                    /*16*/ '    [array[i], array[largest]] = [array[largest], array[i]];',
                    /*17*/ '    heapify(n, largest);',
                    /*18*/ '  }',
                    /*19*/ '}'
                ]
            },
            shell: {
                titulo: 'Shell Sort',
                lineas: [
                    /*0*/ 'function shellSort() {',
                    /*1*/ '  for (let gap = Math.floor(n / 2); gap > 0;',
                    /*2*/ '           gap = Math.floor(gap / 2)) {',
                    /*3*/ '    for (let i = gap; i < n; i++) {',
                    /*4*/ '      let temp = array[i];',
                    /*5*/ '      let j;',
                    /*6*/ '      for (j = i; j >= gap && array[j - gap] > temp; j -= gap) {',
                    /*7*/ '        array[j] = array[j - gap];',
                    /*8*/ '      }',
                    /*9*/ '      array[j] = temp;',
                    /*10*/ '    }',
                    /*11*/ '  }',
                    /*12*/ '}'
                ]
            },
            stooge: {
                titulo: 'Stooge Sort',
                lineas: [
                    /*0*/ 'function stoogeSort(l, h) {',
                    /*1*/ '  if (array[l] > array[h]) {',
                    /*2*/ '    [array[l], array[h]] = [array[h], array[l]];',
                    /*3*/ '  }',
                    /*4*/ '  if (h - l + 1 > 2) {',
                    /*5*/ '    let t = Math.floor((h - l + 1) / 3);',
                    /*6*/ '    stoogeSort(l, h - t);',
                    /*7*/ '    stoogeSort(l + t, h);',
                    /*8*/ '    stoogeSort(l, h - t);',
                    /*9*/ '  }',
                    /*10*/ '}'
                ]
            }
        };

        const codeTitle = document.getElementById('code-title');
        const codeBody = document.getElementById('code-body');
        let filasActivas = [];

        // Dibuja en el panel derecho el código del algoritmo indicado
        function mostrarCodigo(nombre) {
            const info = CODIGOS[nombre];
            if (!info) return;
            codeTitle.innerText = `Código: ${info.titulo}`;
            codeBody.innerHTML = '';
            filasActivas = [];
            info.lineas.forEach((texto, i) => {
                const fila = document.createElement('div');
                fila.classList.add('code-line');
                if (texto.trim().startsWith('//')) fila.classList.add('code-comment');
                const num = document.createElement('span');
                num.classList.add('code-num');
                num.textContent = i + 1;
                const cod = document.createElement('span');
                cod.textContent = texto;
                fila.appendChild(num);
                fila.appendChild(cod);
                codeBody.appendChild(fila);
            });
            codeBody.scrollTop = 0;
        }

        // Marca la(s) línea(s) que se están ejecutando en este momento
        function resaltar(lineas) {
            const indices = [].concat(lineas);
            filasActivas.forEach(f => f.classList.remove('activa'));
            filasActivas = [];
            indices.forEach(i => {
                const fila = codeBody.children[i];
                if (fila) {
                    fila.classList.add('activa');
                    filasActivas.push(fila);
                }
            });
            // Mantener a la vista la primera línea resaltada (sin mover la página)
            const primera = filasActivas[0];
            if (primera) {
                const arriba = primera.offsetTop;
                const abajo = arriba + primera.offsetHeight;
                if (arriba < codeBody.scrollTop || abajo > codeBody.scrollTop + codeBody.clientHeight) {
                    codeBody.scrollTop = Math.max(0, arriba - codeBody.clientHeight / 2);
                }
            }
        }

        function limpiarResaltado() {
            filasActivas.forEach(f => f.classList.remove('activa'));
            filasActivas = [];
        }

        // Pausa corta (respeta pausa/velocidad) para que se alcance a ver la línea resaltada
        async function pausaPaso() {
            await checkControlState();
            await sleep(parseInt(speedSlider.value));
        }

        // --- 1. BUBBLE SORT ---
        async function bubbleSort() {
            const bars = document.getElementsByClassName('bar');
            let len = array.length;
            for (let i = 0; i < len; i++) {
                for (let j = 0; j < len - i - 1; j++) {
                    await checkControlState();
                    bars[j].style.backgroundColor = '#3182ce';
                    bars[j + 1].style.backgroundColor = '#3182ce';
                    let speed = parseInt(speedSlider.value);
                    resaltar([2]);
                    await sleep(speed);

                    if (array[j] > array[j + 1]) {
                        resaltar([3, 4, 5]);
                        let temp = array[j];
                        array[j] = array[j + 1];
                        array[j + 1] = temp;
                        bars[j].style.height = `${array[j] * 3}px`;
                        bars[j + 1].style.height = `${array[j + 1] * 3}px`;
                        bars[j].style.backgroundColor = '#dd6b20';
                        bars[j + 1].style.backgroundColor = '#dd6b20';
                        await sleep(speed);
                    }
                    bars[j].style.backgroundColor = '#4a5568';
                    bars[j + 1].style.backgroundColor = '#4a5568';
                }
                bars[len - i - 1].style.backgroundColor = '#38a169';
            }
        }

        // --- 2. INSERTION SORT ---
        async function insertionSort() {
            const bars = document.getElementsByClassName('bar');
            for (let i = 1; i < array.length; i++) {
                let key = array[i];
                let j = i - 1;
                await checkControlState();
                bars[i].style.backgroundColor = '#d69e2e';
                resaltar([1, 2]);

                while (j >= 0 && array[j] > key) {
                    await checkControlState();
                    resaltar([3, 4, 5]);
                    bars[j].style.backgroundColor = '#3182ce';
                    bars[j + 1].style.backgroundColor = '#3182ce';
                    let speed = parseInt(speedSlider.value);
                    await sleep(speed);

                    array[j + 1] = array[j];
                    bars[j + 1].style.height = `${array[j + 1] * 3}px`;
                    bars[j].style.backgroundColor = '#4a5568';
                    bars[j + 1].style.backgroundColor = '#4a5568';
                    j = j - 1;
                }
                resaltar([7]);
                array[j + 1] = key;
                bars[j + 1].style.height = `${key * 3}px`;
                await pausaPaso();
            }
            for (let i = 0; i < bars.length; i++) bars[i].style.backgroundColor = '#38a169';
        }

        // --- 3. SELECTION SORT ---
        async function selectionSort() {
            const bars = document.getElementsByClassName('bar');
            let n = array.length;
            for (let i = 0; i < n; i++) {
                let minIdx = i;
                bars[minIdx].style.backgroundColor = '#d69e2e';
                resaltar([1]);
                for (let j = i + 1; j < n; j++) {
                    await checkControlState();
                    resaltar(array[j] < array[minIdx] ? [2, 3, 4] : [2, 3]);
                    bars[j].style.backgroundColor = '#3182ce';
                    let speed = parseInt(speedSlider.value);
                    await sleep(speed);

                    if (array[j] < array[minIdx]) {
                        bars[minIdx].style.backgroundColor = '#4a5568';
                        minIdx = j;
                        bars[minIdx].style.backgroundColor = '#d69e2e';
                    } else {
                        bars[j].style.backgroundColor = '#4a5568';
                    }
                }
                if (minIdx !== i) {
                    resaltar([7, 8, 9, 10]);
                    let temp = array[i];
                    array[i] = array[minIdx];
                    array[minIdx] = temp;
                    bars[i].style.height = `${array[i] * 3}px`;
                    bars[minIdx].style.height = `${array[minIdx] * 3}px`;
                    await pausaPaso();
                }
                bars[minIdx].style.backgroundColor = '#4a5568';
                bars[i].style.backgroundColor = '#38a169';
            }
        }

        // --- 4. MERGE SORT ---
        async function mergeSort(start = 0, end = array.length - 1) {
            if (start >= end) return;
            const mid = Math.floor((start + end) / 2);
            resaltar([3]);
            await mergeSort(start, mid);
            resaltar([4]);
            await mergeSort(mid + 1, end);
            resaltar([5]);
            await merge(start, mid, end);
        }

        async function merge(start, mid, end) {
            const bars = document.getElementsByClassName('bar');
            let tempArray = [];
            let i = start, j = mid + 1;
            resaltar([9, 10, 11, 12, 14, 15]);

            while (i <= mid && j <= end) {
                await checkControlState();
                if (array[i] <= array[j]) {
                    tempArray.push(array[i++]);
                } else {
                    tempArray.push(array[j++]);
                }
            }
            while (i <= mid) tempArray.push(array[i++]);
            while (j <= end) tempArray.push(array[j++]);
            await pausaPaso();

            for (let k = 0; k < tempArray.length; k++) {
                await checkControlState();
                let idx = start + k;
                resaltar([17, 18]);
                array[idx] = tempArray[k];
                bars[idx].style.height = `${array[idx] * 3}px`;
                bars[idx].style.backgroundColor = '#dd6b20';
                let speed = parseInt(speedSlider.value);
                await sleep(speed);
                bars[idx].style.backgroundColor = (end - start === array.length - 1) ? '#38a169' : '#4a5568';
            }
        }

        // --- 5. QUICK SORT ---
        async function quickSort(low = 0, high = array.length - 1) {
            if (low < high) {
                resaltar([2]);
                let pi = await partition(low, high);
                resaltar([3]);
                await quickSort(low, pi - 1);
                resaltar([4]);
                await quickSort(pi + 1, high);
            }
            if (low === 0 && high === array.length - 1) {
                const bars = document.getElementsByClassName('bar');
                for (let i = 0; i < bars.length; i++) bars[i].style.backgroundColor = '#38a169';
            }
        }

        async function partition(low, high) {
            const bars = document.getElementsByClassName('bar');
            let pivot = array[high];
            bars[high].style.backgroundColor = '#e53e3e';
            let i = (low - 1);
            resaltar([8, 9]);
            await pausaPaso();

            for (let j = low; j <= high - 1; j++) {
                await checkControlState();
                resaltar(array[j] < pivot ? [10, 11, 12, 13] : [10, 11]);
                bars[j].style.backgroundColor = '#3182ce';
                let speed = parseInt(speedSlider.value);
                await sleep(speed);

                if (array[j] < pivot) {
                    i++;
                    let temp = array[i];
                    array[i] = array[j];
                    array[j] = temp;
                    bars[i].style.height = `${array[i] * 3}px`;
                    bars[j].style.height = `${array[j] * 3}px`;
                }
                bars[j].style.backgroundColor = '#4a5568';
            }
            resaltar([16, 17]);
            await pausaPaso();
            let temp = array[i + 1];
            array[i + 1] = array[high];
            array[high] = temp;
            bars[i + 1].style.height = `${array[i + 1] * 3}px`;
            bars[high].style.height = `${array[high] * 3}px`;
            bars[high].style.backgroundColor = '#4a5568';
            return (i + 1);
        }

        // --- 6. HEAP SORT ---
        async function heapSort() {
            const bars = document.getElementsByClassName('bar');
            let n = array.length;

            for (let i = Math.floor(n / 2) - 1; i >= 0; i--) {
                resaltar([2, 3]);
                await heapify(n, i);
            }

            for (let i = n - 1; i > 0; i--) {
                await checkControlState();
                resaltar([5, 6]);
                let temp = array[0];
                array[0] = array[i];
                array[i] = temp;
                bars[0].style.height = `${array[0] * 3}px`;
                bars[i].style.height = `${array[i] * 3}px`;
                bars[i].style.backgroundColor = '#38a169';
                await pausaPaso();
                resaltar([7]);
                await heapify(i, 0);
            }
            bars[0].style.backgroundColor = '#38a169';
        }

        async function heapify(n, i) {
            const bars = document.getElementsByClassName('bar');
            let largest = i;
            let l = 2 * i + 1;
            let r = 2 * i + 2;

            if (l < n && array[l] > array[largest]) largest = l;
            if (r < n && array[r] > array[largest]) largest = r;

            if (largest !== i) {
                await checkControlState();
                resaltar([15, 16, 17]);
                let temp = array[i];
                array[i] = array[largest];
                array[largest] = temp;
                bars[i].style.height = `${array[i] * 3}px`;
                bars[largest].style.height = `${array[largest] * 3}px`;
                bars[i].style.backgroundColor = '#3182ce';
                bars[largest].style.backgroundColor = '#3182ce';
                let speed = parseInt(speedSlider.value);
                await sleep(speed);
                bars[i].style.backgroundColor = '#4a5568';
                bars[largest].style.backgroundColor = '#4a5568';
                await heapify(n, largest);
            }
        }

        // --- 7. SHELL SORT ---
        async function shellSort() {
            const bars = document.getElementsByClassName('bar');
            let n = array.length;
            for (let gap = Math.floor(n / 2); gap > 0; gap = Math.floor(gap / 2)) {
                for (let i = gap; i < n; i++) {
                    let temp = array[i];
                    let j;
                    await checkControlState();
                    bars[i].style.backgroundColor = '#d69e2e';
                    let speed = parseInt(speedSlider.value);
                    resaltar([3, 4, 5]);
                    await sleep(speed);

                    resaltar(array[i - gap] > temp ? [6, 7, 9] : [6, 9]);
                    for (j = i; j >= gap && array[j - gap] > temp; j -= gap) {
                        array[j] = array[j - gap];
                        bars[j].style.height = `${array[j] * 3}px`;
                    }
                    array[j] = temp;
                    bars[j].style.height = `${temp * 3}px`;
                    await pausaPaso();
                    bars[i].style.backgroundColor = '#4a5568';
                }
            }
            for (let i = 0; i < bars.length; i++) bars[i].style.backgroundColor = '#38a169';
        }

        // --- 8. STOOGE SORT ---
        async function stoogeSort(l = 0, h = array.length - 1) {
            const bars = document.getElementsByClassName('bar');
            await checkControlState();
            let speed = parseInt(speedSlider.value);
            resaltar([1]);

            if (array[l] > array[h]) {
                resaltar([1, 2]);
                let t = array[l];
                array[l] = array[h];
                array[h] = t;
                bars[l].style.height = `${array[l] * 3}px`;
                bars[h].style.height = `${array[h] * 3}px`;
                bars[l].style.backgroundColor = '#dd6b20';
                bars[h].style.backgroundColor = '#dd6b20';
                await sleep(speed);
                bars[l].style.backgroundColor = '#4a5568';
                bars[h].style.backgroundColor = '#4a5568';
            }
            if (h - l + 1 > 2) {
                resaltar([4, 5]);
                let t = Math.floor((h - l + 1) / 3);
                resaltar([6]);
                await stoogeSort(l, h - t);
                resaltar([7]);
                await stoogeSort(l + t, h);
                resaltar([8]);
                await stoogeSort(l, h - t);
            }
            if (l === 0 && h === array.length - 1) {
                for (let i = 0; i < bars.length; i++) bars[i].style.backgroundColor = '#38a169';
            }
        }

        // --- CONTROL INDEPENDIENTE DE LA COMPARACIÓN (pausar / reiniciar) ---
        const btnCompPause = document.getElementById('btn-comp-pause');
        const btnCompReset = document.getElementById('btn-comp-reset');
        let compRunning = false;     // hay una comparación animándose
        let compPaused = false;      // la comparación está en pausa
        let compRunId = 0;           // identifica la ejecución vigente; al cambiar, las anteriores se cancelan
        let compBaseData = [];       // datos iniciales de la última comparación (para Reiniciar)
        let compPauseInicio = 0;
        let compPausaTotal = 0;      // ms en pausa, para no contarlos en los tiempos

        // Sustituye a sleep() dentro de la comparación: respeta pausa y cancelación
        async function compSleep(ms, runId) {
            await sleep(ms);
            while (compPaused) {
                await sleep(100);
                if (runId !== compRunId) throw new Error("CompStopped");
            }
            if (runId !== compRunId) throw new Error("CompStopped");
        }

        function bloquearControlesComp(bloquear) {
            document.getElementById('algo1-select').disabled = bloquear;
            document.getElementById('algo2-select').disabled = bloquear;
            elementsSliderComp.disabled = bloquear;
            btnCompareStart.disabled = bloquear;
        }

        // Cancela cualquier comparación en curso y deja los controles listos
        function detenerComparacion() {
            compRunId++;
            compRunning = false;
            compPaused = false;
            btnCompPause.innerText = "❚❚ Pausar";
            bloquearControlesComp(false);
        }

        function dibujarBarrasComparacion(datos, containerId) {
            const cont = document.getElementById(containerId);
            cont.innerHTML = '';
            const max = Math.max(...datos, 100);
            datos.forEach(val => {
                const bar = document.createElement('div');
                bar.classList.add('bar');
                bar.style.height = `${(val / max) * 100}%`;
                bar.style.width = `${100 / datos.length}%`;
                cont.appendChild(bar);
            });
        }

        btnCompPause.addEventListener('click', () => {
            if (!compRunning) return;
            compPaused = !compPaused;
            if (compPaused) compPauseInicio = performance.now();
            else compPausaTotal += performance.now() - compPauseInicio;
            btnCompPause.innerText = compPaused ? "▶ Reanudar" : "❚❚ Pausar";
        });

        btnCompReset.addEventListener('click', () => {
            detenerComparacion();
            if (compBaseData.length > 0) {
                dibujarBarrasComparacion(compBaseData, 'container-algo1');
                dibujarBarrasComparacion(compBaseData, 'container-algo2');
            } else {
                generarBarrasComparacion(elementsSliderComp.value, 'container-algo1');
                generarBarrasComparacion(elementsSliderComp.value, 'container-algo2');
            }
            document.getElementById('time-algo1').innerText = 'Tiempo: 0 ms';
            document.getElementById('time-algo2').innerText = 'Tiempo: 0 ms';
            document.getElementById('comparison-result').innerText = '';
        });

        // Función auxiliar para renderizar barras iniciales de comparación
        function generarBarrasComparacion(numElementos, containerId) {
            const cont = document.getElementById(containerId);
            cont.innerHTML = '';
            let datosTemp = [];
            for (let i = 0; i < numElementos; i++) {
                const valor = Math.floor(Math.random() * 100) + 15;
                datosTemp.push(valor);
            }
            const max = Math.max(...datosTemp, 100);
            datosTemp.forEach(val => {
                const bar = document.createElement('div');
                bar.classList.add('bar');
                bar.style.height = `${(val / max) * 100}%`;
                bar.style.width = `${100 / datosTemp.length}%`;
                cont.appendChild(bar);
            });
            return datosTemp;
        }

        // Función simuladora animada para cualquier algoritmo en el panel de comparación
        async function animarAlgoritmoComparacion(nombre, arr, containerId, runId) {
            let a = [...arr];
            const cont = document.getElementById(containerId);
            cont.innerHTML = '';
            const max = Math.max(...a, 100);

            a.forEach(val => {
                const bar = document.createElement('div');
                bar.classList.add('bar');
                bar.style.height = `${(val / max) * 100}%`;
                bar.style.width = `${100 / a.length}%`;
                cont.appendChild(bar);
            });
            const bars = cont.getElementsByClassName('bar');
            let speed = parseInt(speedSlider.value);

            async function swapBars(i, j) {
                let temp = a[i]; a[i] = a[j]; a[j] = temp;
                bars[i].style.height = `${(a[i] / max) * 100}%`;
                bars[j].style.height = `${(a[j] / max) * 100}%`;
                bars[i].style.backgroundColor = '#dd6b20';
                bars[j].style.backgroundColor = '#dd6b20';
                await compSleep(speed, runId);
                bars[i].style.backgroundColor = '#4a5568';
                bars[j].style.backgroundColor = '#4a5568';
            }

            async function setBar(idx, val) {
                a[idx] = val;
                bars[idx].style.height = `${(val / max) * 100}%`;
                bars[idx].style.backgroundColor = '#3182ce';
                await compSleep(speed, runId);
                bars[idx].style.backgroundColor = '#4a5568';
            }

            // Ejecución animada paso a paso según el algoritmo seleccionado
            if (nombre === 'bubble') {
                let len = a.length;
                for (let i = 0; i < len; i++) {
                    for (let j = 0; j < len - i - 1; j++) {
                        bars[j].style.backgroundColor = '#3182ce';
                        bars[j + 1].style.backgroundColor = '#3182ce';
                        await compSleep(speed, runId);
                        if (a[j] > a[j + 1]) await swapBars(j, j + 1);
                        bars[j].style.backgroundColor = '#4a5568';
                        bars[j + 1].style.backgroundColor = '#4a5568';
                    }
                    bars[len - i - 1].style.backgroundColor = '#38a169';
                }
            } else if (nombre === 'insertion') {
                for (let i = 1; i < a.length; i++) {
                    let key = a[i];
                    let j = i - 1;
                    bars[i].style.backgroundColor = '#d69e2e';
                    await compSleep(speed, runId);
                    while (j >= 0 && a[j] > key) {
                        a[j + 1] = a[j];
                        bars[j + 1].style.height = `${(a[j + 1] / max) * 100}%`;
                        j--;
                        await compSleep(speed, runId);
                    }
                    a[j + 1] = key;
                    bars[j + 1].style.height = `${(key / max) * 100}%`;
                    bars[i].style.backgroundColor = '#4a5568';
                }
                for (let bar of bars) bar.style.backgroundColor = '#38a169';
            } else if (nombre === 'selection') {
                let n = a.length;
                for (let i = 0; i < n; i++) {
                    let minIdx = i;
                    bars[minIdx].style.backgroundColor = '#d69e2e';
                    for (let j = i + 1; j < n; j++) {
                        bars[j].style.backgroundColor = '#3182ce';
                        await compSleep(speed, runId);
                        if (a[j] < a[minIdx]) {
                            bars[minIdx].style.backgroundColor = '#4a5568';
                            minIdx = j;
                            bars[minIdx].style.backgroundColor = '#d69e2e';
                        } else {
                            bars[j].style.backgroundColor = '#4a5568';
                        }
                    }
                    if (minIdx !== i) await swapBars(i, minIdx);
                    bars[minIdx].style.backgroundColor = '#4a5568';
                    bars[i].style.backgroundColor = '#38a169';
                }
            } else if (nombre === 'quick') {
                async function qSort(low, high) {
                    if (low < high) {
                        let pivot = a[high];
                        bars[high].style.backgroundColor = '#e53e3e';
                        let i = low - 1;
                        for (let j = low; j <= high - 1; j++) {
                            bars[j].style.backgroundColor = '#3182ce';
                            await compSleep(speed, runId);
                            if (a[j] < pivot) {
                                i++;
                                await swapBars(i, j);
                            }
                            bars[j].style.backgroundColor = '#4a5568';
                        }
                        await swapBars(i + 1, high);
                        bars[high].style.backgroundColor = '#4a5568';
                        let pi = i + 1;
                        await qSort(low, pi - 1);
                        await qSort(pi + 1, high);
                    }
                }
                await qSort(0, a.length - 1);
                for (let bar of bars) bar.style.backgroundColor = '#38a169';
            } else if (nombre === 'merge') {
                async function mSort(start, end) {
                    if (start >= end) return;
                    let mid = Math.floor((start + end) / 2);
                    await mSort(start, mid);
                    await mSort(mid + 1, end);
                    let tempArr = [];
                    let i = start, j = mid + 1;
                    while (i <= mid && j <= end) {
                        if (a[i] <= a[j]) tempArr.push(a[i++]);
                        else tempArr.push(a[j++]);
                    }
                    while (i <= mid) tempArr.push(a[i++]);
                    while (j <= end) tempArr.push(a[j++]);
                    for (let k = 0; k < tempArr.length; k++) {
                        await setBar(start + k, tempArr[k]);
                    }
                }
                await mSort(0, a.length - 1);
                for (let bar of bars) bar.style.backgroundColor = '#38a169';
            } else if (nombre === 'heap') {
                let n = a.length;
                async function heapify(n, i) {
                    let largest = i;
                    let l = 2 * i + 1, r = 2 * i + 2;
                    if (l < n && a[l] > a[largest]) largest = l;
                    if (r < n && a[r] > a[largest]) largest = r;
                    if (largest !== i) {
                        await swapBars(i, largest);
                        await heapify(n, largest);
                    }
                }
                for (let i = Math.floor(n / 2) - 1; i >= 0; i--) await heapify(n, i);
                for (let i = n - 1; i > 0; i--) {
                    await swapBars(0, i);
                    bars[i].style.backgroundColor = '#38a169';
                    await heapify(i, 0);
                }
                bars[0].style.backgroundColor = '#38a169';
            } else if (nombre === 'shell') {
                let n = a.length;
                for (let gap = Math.floor(n / 2); gap > 0; gap = Math.floor(gap / 2)) {
                    for (let i = gap; i < n; i++) {
                        let temp = a[i];
                        let j;
                        bars[i].style.backgroundColor = '#d69e2e';
                        await compSleep(speed, runId);
                        for (j = i; j >= gap && a[j - gap] > temp; j -= gap) {
                            a[j] = a[j - gap];
                            bars[j].style.height = `${(a[j] / max) * 100}%`;
                        }
                        a[j] = temp;
                        bars[j].style.height = `${(temp / max) * 100}%`;
                        bars[i].style.backgroundColor = '#4a5568';
                    }
                }
                for (let bar of bars) bar.style.backgroundColor = '#38a169';
            } else if (nombre === 'stooge') {
                async function sSort(l, h) {
                    if (a[l] > a[h]) await swapBars(l, h);
                    if (h - l + 1 > 2) {
                        let t = Math.floor((h - l + 1) / 3);
                        await sSort(l, h - t);
                        await sSort(l + t, h);
                        await sSort(l, h - t);
                    }
                }
                await sSort(0, a.length - 1);
                for (let bar of bars) bar.style.backgroundColor = '#38a169';
            }
        }

        // Mostrar panel de comparación y generar arreglos iniciales iguales
        btnCompare.addEventListener('click', () => {
            if (isSorting) return;
            const containerComp = document.getElementById('comparison-container');
            const isVisible = containerComp.style.display === 'flex';
            if (isVisible) detenerComparacion(); else compBaseData = [];
            containerComp.style.display = isVisible ? 'none' : 'flex';
            
            if (!isVisible) {
                const numComp = elementsSliderComp.value;
                generarBarrasComparacion(numComp, 'container-algo1');
                generarBarrasComparacion(numComp, 'container-algo2');
                document.getElementById('comparison-result').innerText = '';
            }
        });

        // Actualizar barras de comparación al mover el slider de elementos de comparación
        elementsSliderComp.addEventListener('input', (e) => {
            const val = e.target.value;
            labelElementsComp.innerText = `Elementos: ${val}`;
            compBaseData = [];
            generarBarrasComparacion(val, 'container-algo1');
            generarBarrasComparacion(val, 'container-algo2');
            document.getElementById('comparison-result').innerText = '';
        });

        // Manejador del Botón Iniciar Comparación con Animación y Tiempos Simultáneos
        btnCompareStart.addEventListener('click', async () => {
            if (compRunning) return;
            const numComp = elementsSliderComp.value;
            const baseData = generarBarrasComparacion(numComp, 'container-algo1');
            compBaseData = [...baseData];
            compRunning = true;
            compPaused = false;
            compPausaTotal = 0;
            btnCompPause.innerText = "❚❚ Pausar";
            const runId = ++compRunId;
            bloquearControlesComp(true);
            // Replicar los mismos datos exactos para el contenedor 2 para una comparación justa
            const cont2 = document.getElementById('container-algo2');
            cont2.innerHTML = '';
            const max = Math.max(...baseData, 100);
            baseData.forEach(val => {
                const bar = document.createElement('div');
                bar.classList.add('bar');
                bar.style.height = `${(val / max) * 100}%`;
                bar.style.width = `${100 / baseData.length}%`;
                cont2.appendChild(bar);
            });

            const algo1Name = document.getElementById('algo1-select').value;
            const algo2Name = document.getElementById('algo2-select').value;

            const name1 = document.querySelector(`#algo1-select option[value="${algo1Name}"]`).text;
            const name2 = document.querySelector(`#algo2-select option[value="${algo2Name}"]`).text;

            document.getElementById('title-algo1').innerText = name1;
            document.getElementById('title-algo2').innerText = name2;
            document.getElementById('comparison-result').innerText = "Animando y midiendo ambos métodos...";

            let time1 = 0;
            let time2 = 0;

            // Ejecución simultánea e independiente para Método 1
            const promesa1 = (async () => {
                let tStart = performance.now();
                try {
                    await animarAlgoritmoComparacion(algo1Name, [...baseData], 'container-algo1', runId);
                } catch (e) {
                    return; // detenido con Reiniciar
                }
                let tEnd = performance.now();
                time1 = (tEnd - tStart - compPausaTotal).toFixed(2);
                document.getElementById('time-algo1').innerText = `Tiempo: ${time1} ms`;
            })();

            // Ejecución simultánea e independiente para Método 2
            const promesa2 = (async () => {
                let tStart = performance.now();
                try {
                    await animarAlgoritmoComparacion(algo2Name, [...baseData], 'container-algo2', runId);
                } catch (e) {
                    return; // detenido con Reiniciar
                }
                let tEnd = performance.now();
                time2 = (tEnd - tStart - compPausaTotal).toFixed(2);
                document.getElementById('time-algo2').innerText = `Tiempo: ${time2} ms`;
            })();

            // Esperar a que ambos terminen para emitir el mensaje final
            await Promise.all([promesa1, promesa2]);
            if (runId !== compRunId) return; // la comparación fue reiniciada

            const resText = document.getElementById('comparison-result');
            resText.innerText = `${name1} termino con: ${time1} ms y el ${name2} termino con: ${time2} ms`;
            compRunning = false;
            compPaused = false;
            btnCompPause.innerText = "❚❚ Pausar";
            bloquearControlesComp(false);
        });

        // Manejador del Botón Iniciar
        btnStart.addEventListener('click', async () => {
            if (isSorting) return;
            isSorting = true;
            stopRequested = false;
            isPaused = false;

            elementsSlider.disabled = true;
            btnGenerate.disabled = true;
            algorithmSelect.disabled = true;

            const selectedAlgo = algorithmSelect.value;
            mostrarCodigo(selectedAlgo);
            
            try {
                if (selectedAlgo === 'bubble') await bubbleSort();
                else if (selectedAlgo === 'insertion') await insertionSort();
                else if (selectedAlgo === 'selection') await selectionSort();
                else if (selectedAlgo === 'merge') await mergeSort();
                else if (selectedAlgo === 'quick') await quickSort();
                else if (selectedAlgo === 'heap') await heapSort();
                else if (selectedAlgo === 'shell') await shellSort();
                else if (selectedAlgo === 'stooge') await stoogeSort();
            } catch (e) {
                // Interrupción por reinicio controlada
            }
            limpiarResaltado();

            isSorting = false;
            elementsSlider.disabled = false;
            btnGenerate.disabled = false;
            algorithmSelect.disabled = false;
        });

        btnPause.addEventListener('click', () => {
            if (!isSorting) return;
            isPaused = !isPaused;
            btnPause.innerText = isPaused ? "▶ Reanudar" : "❚❚ Pausar";
        });

        btnReset.addEventListener('click', () => {
            stopRequested = true;
            isSorting = false;
            isPaused = false;
            btnPause.innerText = "❚❚ Pausar";
            array = [...originalArray];
            updateBars();
            limpiarResaltado();
            detenerComparacion();
            elementsSlider.disabled = false;
            btnGenerate.disabled = false;
            algorithmSelect.disabled = false;
            document.getElementById('comparison-container').style.display = 'none';
            document.getElementById('comparison-result').innerText = '';
        });

        elementsSlider.addEventListener('input', (e) => {
            labelElements.innerText = `Elementos: ${e.target.value}`;
            generateArray();
        });

        speedSlider.addEventListener('input', (e) => {
            labelSpeed.innerText = `Velocidad: ${e.target.value} ms`;
        });

        btnGenerate.addEventListener('click', generateArray);

        algorithmSelect.addEventListener('change', () => mostrarCodigo(algorithmSelect.value));

        window.onload = () => {
            generateArray();
            mostrarCodigo(algorithmSelect.value);
        };
    </script>
</body>

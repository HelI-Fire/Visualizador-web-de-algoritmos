<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HELL FIRE - Visualizador de Algoritmos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        #contenedor-visualizador {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            height: 400px;
            width: 80%;
            margin: 20px auto;
            background-color: #1e1e1e;
            border: 2px solid #ff4500;
            padding: 10px;
            gap: 2px;
        }
        .barra-visualizador {
            background-color: #ff4500;
            transition: height 0.2s ease;
        }
        button {
            background-color: #ff4500;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            border-radius: 5px;
        }
        button:hover {
            background-color: #ff6347;
        }
    </style>
</head>
<body>

    <h1>HELL FIRE - Visualizador de Algoritmos</h1>

    <!-- Contenedor donde tu motor pintará las barras -->
    <div id="contenedor-visualizador"></div>

    <!-- Botones conectados a las funciones que integran datos + render -->
    <button onclick="actualizarVistaConDatosNuevos()">Generar Nuevo Arreglo</button>
    <button onclick="actualizarVistaConReinicio()">Reiniciar Arreglo</button>

    <!-- Enlaces a los scripts del equipo -->
    <script src="datos.js"></script>
    <script src="render.js"></script>

</body>
</html>
